name: Telegram ID Checker Tests

on:
  push:
    branches:
      - fix/first-seen-date
    paths:
      - "telegram-id-checker/**"
      - ".github/workflows/telegram-id-checker-tests.yml"
  pull_request:
    paths:
      - "telegram-id-checker/**"
      - ".github/workflows/telegram-id-checker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-id-checker
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-id-checker/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
